<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Shelf &mdash; Interactive Tour</title>
<meta name="description" content="A hover-to-explore tour of The Shelf, a self-hosted home network hub: photos, music, videos, games, office tools, chat, remote desktop and a private AI.">
<style>
/* ---------- design plan ----------
   Color: recreates The Shelf's own dark plum/ink palette (--ink, --surface,
   --accent) rather than a generic theme — this page is a faithful skin of
   a real, already-designed dark app, so it stays single-theme like the app
   itself, and category colors are the app's own (amber/mint/pink/blue/coral/lilac).
   Type: Georgia-style serif for the wordmark/headings (matches the app's
   --serif use in its own logo/headings), a clean system sans for UI text.
   Layout: the app's real shell — fixed dark sidebar (shelves + tools nav,
   each item a hoverable "balloon" callout) beside a live-swapping content
   pane that mocks each section well enough to explain what it does.
------------------------------------ */
:root{
  --ink:#241B2F; --ink-deep:#1B1424; --surface:#322542; --surface-hi:#3D2D53;
  --text:#F0E9E3; --text-muted:#B7ABBA; --accent:#F2B441; --accent-ink:#2A1D0E;
  --mint:#6FCF97; --coral:#E2725B; --divider:#4A3B5C;
  --cat-pictures:#F2B441; --cat-music:#6FCF97; --cat-videos:#E091B3;
  --cat-games:#7AA8F2; --cat-programs:#E2725B; --cat-books:#B98FE8;
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{
  background:var(--ink); color:var(--text); font-family:var(--sans);
  margin:0; padding-inline:0; min-height:100%;
}
h1,h2,h3{font-family:var(--serif); text-wrap:balance; margin:0;}

.app{display:flex; min-height:100vh; max-width:1400px; margin:0 auto;}

/* ---------- sidebar ---------- */
.sidebar{
  width:270px; flex-shrink:0; background:var(--ink-deep);
  border-right:1px solid var(--divider); padding:26px 16px;
  display:flex; flex-direction:column; gap:18px;
}
.brand{display:flex; align-items:center; gap:12px; padding:0 6px;}
.brand-mark{font-size:22px; color:var(--accent); line-height:1;}
.brand h1{font-size:21px;}
.brand p{margin:2px 0 0; font-size:11.5px; color:var(--text-muted);}

.toggle-group{display:flex; flex-direction:column; gap:2px;}
.toggle-row{display:flex; align-items:center; gap:10px; padding:4px 6px; border-radius:6px;}
.switch{width:34px; height:19px; border-radius:20px; background:var(--divider); position:relative; flex-shrink:0;}
.switch.on{background:var(--mint);}
.switch::after{content:""; position:absolute; width:14px; height:14px; border-radius:50%; background:#fff; top:2.5px; left:3px; transition:transform .15s ease;}
.switch.on::after{transform:translateX(15px);}
.toggle-row span.lbl{font-size:12.5px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

.nav-label{font-size:10.5px; color:var(--text-muted); letter-spacing:.08em; text-transform:uppercase; padding:6px 6px 0;}

.shelf-nav, .tool-nav{display:flex; flex-direction:column; gap:2px;}
.shelf-item{
  display:flex; align-items:center; gap:10px; padding:8px 6px; border-radius:7px;
  cursor:pointer; font-size:13.5px;
}
.shelf-item:hover, .shelf-item.active{background:var(--surface);}
.swatch{width:9px; height:9px; border-radius:50%; background:var(--cat-color,var(--accent)); flex-shrink:0;}

.sidebar-foot{margin-top:auto; font-size:11px; color:var(--text-muted); padding:8px 6px 0; border-top:1px solid var(--divider);}

/* ---------- balloon tooltips ---------- */
.hot{position:relative; cursor:help;}
.hot.underline{border-bottom:1px dotted var(--accent);}
.hot::after{
  content:attr(data-tip); position:absolute; z-index:40;
  background:var(--surface-hi); color:var(--text); border:1px solid var(--divider);
  border-radius:10px; padding:10px 12px; font-size:12.5px; line-height:1.4;
  width:max-content; max-width:230px; box-shadow:0 8px 24px rgba(0,0,0,.45);
  opacity:0; transform:translateY(4px) scale(.97); pointer-events:none;
  transition:opacity .14s ease, transform .14s ease;
}
.hot::before{
  content:""; position:absolute; z-index:41; width:10px; height:10px;
  background:var(--surface-hi); border:1px solid var(--divider); border-right:none; border-top:none;
  opacity:0; transition:opacity .14s ease; pointer-events:none;
}
.hot:hover::after, .hot:hover::before, .hot:focus-visible::after, .hot:focus-visible::before,
.hot.show::after, .hot.show::before{opacity:1;}

/* pop to the right (sidebar items near the left edge) */
.tip-r::after{left:calc(100% + 14px); top:50%; transform:translateY(-50%);}
.tip-r.hot:hover::after, .tip-r.hot:focus-visible::after, .tip-r.hot.show::after{transform:translateY(-50%);}
.tip-r::before{left:calc(100% + 6px); top:50%; transform:translateY(-50%) rotate(135deg);}

/* pop above (content-area items) */
.tip-t::after{left:50%; bottom:calc(100% + 12px); transform:translate(-50%,4px);}
.tip-t.hot:hover::after, .tip-t.hot:focus-visible::after, .tip-t.hot.show::after{transform:translate(-50%,0);}
.tip-t::before{left:50%; bottom:calc(100% + 5px); transform:translateX(-50%) rotate(-45deg);}

/* pop below */
.tip-b::after{left:50%; top:calc(100% + 12px); transform:translate(-50%,-4px);}
.tip-b.hot:hover::after, .tip-b.hot:focus-visible::after, .tip-b.hot.show::after{transform:translate(-50%,0);}
.tip-b::before{left:50%; top:calc(100% + 5px); transform:translateX(-50%) rotate(135deg);}

/* ---------- main / content ---------- */
main{flex:1; min-width:0; display:flex; flex-direction:column;}
header.topbar{
  padding:22px 28px 16px; border-bottom:1px solid var(--divider);
  display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
header.topbar h2{font-size:22px;}
header.topbar p{margin:3px 0 0; font-size:13px; color:var(--text-muted);}
.content{padding:24px 28px 60px; min-width:0;}

.empty-note{color:var(--text-muted); font-size:13.5px; max-width:60ch; line-height:1.5;}

/* generic building blocks reused across mocked sections */
.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px;}
.card{background:var(--surface); border:1px solid var(--divider); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:8px;}
.thumb{aspect-ratio:4/3; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--accent-ink); font-weight:700;}
.card .name{font-size:13.5px; font-weight:600;}
.card .meta{font-size:11.5px; color:var(--text-muted);}
.pill-btn{background:var(--accent); color:var(--accent-ink); border:none; border-radius:6px; padding:6px 11px; font-size:12.5px; font-weight:600; cursor:default;}
.pill-btn.ghost{background:none; border:1px solid var(--divider); color:var(--text-muted);}

.row-list{display:flex; flex-direction:column; gap:6px;}
.row{display:flex; align-items:center; gap:12px; background:var(--surface); border-radius:8px; padding:10px 12px; font-size:13px;}
.row .meta{color:var(--text-muted); font-size:11.5px; margin-left:auto;}

.dashboard-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px;}
.tile{background:var(--surface); border:1px solid var(--divider); border-radius:12px; padding:16px;}
.tile h3{font-size:14px; margin-bottom:8px;}
.sticky{border-radius:8px; padding:12px; font-size:12px; color:#2a1d0e; line-height:1.35;}

.toolbar{display:flex; gap:8px; flex-wrap:wrap; padding:10px; background:var(--surface); border-radius:10px; margin-bottom:14px;}
.toolbar .t{background:var(--ink-deep); border:1px solid var(--divider); border-radius:6px; padding:6px 10px; font-size:12px; color:var(--text-muted);}

.mock-page{background:#fff; color:#2a2530; border-radius:8px; padding:22px; min-height:160px; font-size:13px; line-height:1.6;}
.mock-sheet{display:grid; grid-template-columns:34px repeat(5,1fr); gap:1px; background:var(--divider); border-radius:6px; overflow:hidden; font-size:12px;}
.mock-sheet > div{background:var(--ink-deep); padding:6px 8px;}
.mock-sheet .head{background:var(--surface); color:var(--text-muted); text-align:center;}

.chat-log{display:flex; flex-direction:column; gap:10px; margin-bottom:12px;}
.bubble{max-width:70%; padding:9px 13px; border-radius:12px; font-size:13px; line-height:1.4;}
.bubble.me{background:var(--accent); color:var(--accent-ink); align-self:flex-end; border-bottom-right-radius:2px;}
.bubble.them{background:var(--surface); align-self:flex-start; border-bottom-left-radius:2px;}

.progress-shell{background:var(--surface); border:1px solid var(--divider); border-radius:8px; height:24px; position:relative; overflow:hidden;}
.progress-fill{position:absolute; inset:0 auto 0 0; width:62%; background:var(--mint); opacity:.3;}
.progress-shell span{position:relative; z-index:1; display:flex; align-items:center; height:100%; padding:0 10px; font-size:12px;}

.gh-link{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:var(--accent-ink); text-decoration:none; font-weight:700; font-size:13px; padding:8px 14px; border-radius:8px;}
.gh-link:hover{filter:brightness(1.08);}
.gh-link.ghost{background:none; color:var(--text); border:1px solid var(--divider); font-weight:600;}
.top-actions{display:flex; gap:8px; flex-wrap:wrap;}
.new-badge{font-size:9.5px; font-weight:700; letter-spacing:.06em; background:var(--mint); color:#10301d; border-radius:4px; padding:1px 5px; margin-left:auto;}
.hint{font-size:12px; color:var(--text-muted); margin:0 0 14px;}
.btn-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.input-mock{background:var(--ink-deep); border:1px solid var(--divider); border-radius:6px; padding:7px 10px; font-size:12.5px; color:var(--text-muted); min-width:180px;}
.badge{font-size:10.5px; border-radius:4px; padding:2px 6px; background:var(--mint); color:#10301d; font-weight:700;}
.menu-pop{background:var(--surface-hi); border:1px solid var(--divider); border-radius:10px; padding:6px; display:inline-flex; flex-direction:column; gap:2px; min-width:240px;}
.menu-pop div{padding:8px 10px; border-radius:6px; font-size:13px;}
.menu-pop div small{display:block; color:var(--text-muted); font-size:11.5px;}
.menu-pop div:hover{background:var(--surface);}
@media (max-width:820px){
  .app{flex-direction:column;}
  .sidebar{width:auto; flex-direction:row; flex-wrap:wrap; align-items:flex-start;}
  .brand{width:100%;}
  .toggle-group, .shelf-nav, .tool-nav{flex:1; min-width:160px;}
  .sidebar-foot{width:100%; margin-top:6px;}
  .tip-r::after, .tip-r.hot:hover::after, .tip-r.hot:focus-visible::after, .tip-r.hot.show::after{left:0; top:calc(100% + 8px); transform:none; max-width:min(260px,80vw);}
  .tip-r::before{display:none;}
  .tip-t::after{max-width:min(230px,80vw);}
  html,body{overflow-x:hidden;} .app{overflow-x:clip;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">

        <div class="switch"></div><span class="lbl">Anonymous read only &nbsp;&#9881;</span>
      </div>

      <span>&#65291;&nbsp; Add something</span>
    </div>

    <div class="sidebar-foot hot tip-r" data-tip="The address anyone else on your Wi-Fi types in to reach this same Shelf from their own phone, laptop or TV &mdash; shown live once the real app is running.">

    </div>

      </div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>

  {key:'Pictures', color:'var(--cat-pictures)', tip:"Photos as a grid. Full-screen viewer, a slideshow with Ken Burns pan/zoom and your music playing behind it, a built-in photo editor, and 'Create with AI' to draw new pictures from a description."},

function makeItem(item, extraHtml){
  const d = document.createElement('div');
  d.className = 'shelf-item hot tip-r underline';
  const dec = document.createElement('textarea'); dec.innerHTML = item.tip;
  d.dataset.tip = dec.value;
  d.innerHTML = extraHtml + `<span>${item.key}</span>` + (item.isNew ? '<span class="new-badge">NEW</span>' : '');
  d.addEventListener('click', ()=>{
    document.querySelectorAll('.shelf-item.active').forEach(x=>x.classList.remove('active'));
    d.classList.add('active');
    render(item.key);
    history.replaceState(null, '', '#' + encodeURIComponent(item.key));
  });
  return d;
}
const shelfNav = document.getElementById('shelfNav');
SHELVES.forEach(s=>shelfNav.appendChild(makeItem(s, `<span class="swatch" style="--cat-color:${s.color}"></span>`)));
const toolNav = document.getElementById('toolNav');
TOOLS.forEach(t=>toolNav.appendChild(makeItem(t, '')));

function render(key){
  const s = SECTIONS[key] || SECTIONS.Home;
  document.getElementById('secTitle').textContent = SECTIONS[key] ? key : 'Home';
  document.getElementById('secSub').innerHTML = s.sub;
  document.getElementById('content').innerHTML = s.html;
  wireTooltips(document.getElementById('content'));
  window.scrollTo(0,0);
}

function wireTooltips(scope){
  scope.querySelectorAll('.hot').forEach(elm=>{
    if(elm.dataset.wired) return;
    elm.dataset.wired = '1';
    if(!elm.hasAttribute('tabindex')) elm.setAttribute('tabindex','0');
    elm.addEventListener('click', (e)=>{
      e.stopPropagation();
      const wasOpen = elm.classList.contains('show');
      document.querySelectorAll('.hot.show').forEach(x=>x.classList.remove('show'));
      if(!wasOpen) elm.classList.add('show');
    });
  });
}
document.addEventListener('click', ()=>document.querySelectorAll('.hot.show').forEach(x=>x.classList.remove('show')));

wireTooltips(document);
const start = decodeURIComponent(location.hash.slice(1)) || 'Home';
const startEl = [...document.querySelectorAll('.shelf-nav .shelf-item, .tool-nav .shelf-item')].find(x=>x.textContent.replace('NEW','').trim()===start) 
  || [...document.querySelectorAll('.tool-nav .shelf-item')][0];
startEl.classList.add('active');
render(SECTIONS[start] ? start : 'Home');
</script>
